name: release-binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加二进制的 tag，如 v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        working-directory: cli
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="stop-slop-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "cli/target/${{ matrix.target }}/release/stop-slop" dist/
          tar -czf "$name" -C dist stop-slop
          shasum -a 256 "$name" > "$name.sha256"
          cat "$name.sha256"
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="stop-slop-${{ matrix.target }}.zip"
          mkdir -p dist
          cp "cli/target/${{ matrix.target }}/release/stop-slop.exe" dist/
          (cd dist && 7z a "../$name" stop-slop.exe >/dev/null)
          sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            stop-slop-${{ matrix.target }}.*
          fail_on_unmatched_files: true
